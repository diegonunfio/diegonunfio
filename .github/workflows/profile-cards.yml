name: Update profile cards

on:
  schedule:
    - cron: "17 5 * * *"   # todos los días, 05:17 UTC
  workflow_dispatch:         # botón "Run workflow" en la pestaña Actions
  push:
    branches: [main]
    paths:
      - profile.json
      - scripts/generate.py
      - .github/workflows/profile-cards.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate.py

      - name: Commit if something changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "chore: update profile cards"
            git pull --rebase origin main
            git push
          fi
